name: Autopilot

# Daily observation, weekly release. Search Console finalises data about three days
# late, so a 06:00 run reads yesterday's complete picture rather than a partial one.
on:
  schedule:
    - cron: "0 6 * * *"      # observe daily
    - cron: "0 7 * * TUE"    # release weekly
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the cleared safe class (otherwise observe only)"
        type: boolean
        default: false

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Restore Google credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::warning::GCP_SA_KEY is not set — the run will proceed without Search Console data."
          else
            mkdir -p "$HOME/.config/gsc"
            printf '%s' "$GCP_SA_KEY" > "$HOME/.config/gsc/service-account.json"
          fi

      - name: Run the loop
        id: loop
        env:
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:mywebmaster.co.uk' }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          # The loop's state lives in Postgres. Both secrets have existed on this
          # repo since 8 September, but nothing handed them to this step, so every
          # run read its notice queue as "no service-role key" and carried on.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Every finding this site raises is a wording change (new-pages,
          # faq-expand), and those need a model. Without this the apply run
          # entered "Fixing" correctly and then every fixer threw "no AI
          # credentials", so the weekly slot healed nothing. Same defect the
          # Supabase secrets had: present on the repo, never handed to the step.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DRAFTING: ${{ vars.AI_DRAFTING }}
          # Passed so the mode decision is made in tested code, not a bash string
          # compare against the cron — see ops/run-mode.mjs.
          AUTOPILOT_SCHEDULE: ${{ github.event.schedule }}
          AUTOPILOT_APPLY_INPUT: ${{ github.event.inputs.apply }}
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # The weekly slot and an explicit dispatch apply; everything else
          # observes. The decision lives in ops/run-mode.mjs so it is unit-tested
          # rather than trusted to a shell comparison nobody could assert against.
          mode="$(node ops/run-mode.mjs)"
          echo "Run mode: $mode (schedule='${{ github.event.schedule }}', apply='${{ github.event.inputs.apply }}')"
          if [ "$mode" = "apply" ]; then
            node ops/loop.mjs
          else
            node ops/loop.mjs --dry-run
          fi

      - name: Publish the report to a human
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const path = `ops/reports/${date}.md`;
            if (!fs.existsSync(path)) {
              core.warning('No report was produced — the run failed before reporting.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const title = `Autopilot run — ${date}`;
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'autopilot',
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['autopilot'] });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-data-${{ github.run_number }}
          path: |
            ops/data/*.json
            ops/reports/*.md
          retention-days: 90
