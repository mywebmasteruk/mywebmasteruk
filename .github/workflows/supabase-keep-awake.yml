name: Supabase keep-awake

# Free-tier projects pause after inactivity. A tiny daily PostgREST read keeps
# mywebmaster.co.uk (txqjruevxeacqutuvkej) warm. Runs before the Autopilot loop.
on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: supabase-keep-awake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY missing from repo secrets"
            exit 1
          fi
          # Prefer a cheap schema probe that needs no table knowledge.
          code=$(curl -sS -o /tmp/sb-keep.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/")
          echo "HTTP ${code}"
          case "$code" in
            200|404) echo "keep-awake ok" ;;
            *) echo "::error::unexpected response"; head -c 200 /tmp/sb-keep.json; exit 1 ;;
          esac
